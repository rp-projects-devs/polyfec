name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build et tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compilation
        run: make CC=${{ matrix.compiler }}
      - name: Tests
        run: make CC=${{ matrix.compiler }} test

  sanitizers:
    name: AddressSanitizer et UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sanitize

  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make valgrind

  format:
    name: Formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==23.1.2
      - run: make check-format
